name: cleanup-monte-carlo

on:
  push:
    branches: [reproducibility/harden-public-package]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reproducibility/harden-public-package
          fetch-depth: 0
      - name: Correct legacy sensitivity terminology
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/04_monte_carlo.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "# 5. ALTERNATIVE METHOD: Sobol Indices (First-order effects)",
                  "# 5. LEGACY DUPLICATE SPEARMAN DIAGNOSTIC (NOT SOBOL / NOT PARTIAL CORRELATION)",
              ),
              (
                  "# Calculate coefficient of partial correlation\npartial_correlations = {}",
                  "# Historical compatibility output: this repeats the absolute Spearman\n# transformation above. It is retained for traceability, but it is not a\n# Sobol index and not a statistically distinct partial-correlation estimate.\npartial_correlations = {}",
              ),
              (
                  "# Partial correlation coefficient (simplified approach)\n            # represents the individual contribution after accounting for others",
                  "# Legacy duplicate of the absolute Spearman diagnostic.\n            # Do not interpret this as an independent partial correlation.",
              ),
              (
                  "# Plot 2: Partial Correlation Method (Separate)",
                  "# Plot 2: legacy duplicate Spearman diagnostic (retained for traceability)",
              ),
              (
                  "Parameter Sensitivity: Contribution to Emission Variability\\n(Partial Correlation Method)",
                  "Legacy Sensitivity Diagnostic: Normalized Absolute Spearman\\n(Not an independent partial-correlation method)",
              ),
              (
                  "'Partial Correlation (%)': list(partial_contributions_pct.values())",
                  "'Legacy Duplicate Spearman (%)': list(partial_contributions_pct.values())",
              ),
              (
                  "results_df['Average Contribution (%)'] = (results_df['Spearman Correlation (%)'] + \n                                          results_df['Partial Correlation (%)']) / 2",
                  "results_df['Average Contribution (%)'] = (results_df['Spearman Correlation (%)'] + \n                                          results_df['Legacy Duplicate Spearman (%)']) / 2",
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
                  changed = True
              elif new not in text:
                  raise RuntimeError(f"Expected source snippet not found: {old[:80]}")

          if changed:
              path.write_text(text, encoding="utf-8")
              print("Patched legacy sensitivity terminology.")
          else:
              print("Terminology already patched.")
      - name: Validate source
        run: python -m py_compile scripts/04_monte_carlo.py
      - name: Commit terminology correction
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Lucas Orbolato Carvalho"
          git config user.email "40774995+Orbolato@users.noreply.github.com"
          git add scripts/04_monte_carlo.py
          git commit -m "Correct legacy sensitivity terminology"
          git push origin HEAD:reproducibility/harden-public-package
