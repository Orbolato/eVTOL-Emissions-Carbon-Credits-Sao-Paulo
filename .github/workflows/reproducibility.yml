name: reproducibility

on:
  push:
    branches: [main, reproducibility/harden-public-package]
  pull_request:

permissions:
  contents: read

jobs:
  public-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q run_all.py scripts tests

      - name: Verify committed public package
        run: python -m unittest -v tests.test_repository_integrity

      - name: Run public downstream analysis
        env:
          MPLBACKEND: Agg
          PYTHONIOENCODING: utf-8
        run: python run_all.py

      - name: Verify generated analysis outputs
        run: python -m unittest -v tests.test_generated_outputs
